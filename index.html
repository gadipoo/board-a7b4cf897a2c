<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>מערכת הכיתות היומית</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Frank+Ruhl+Libre:wght@500;700&display=swap">
<style>
/* Layout: the school's daily cross-section — one row per class, one column per hour, today's changes written into the slots */
:root {
  --bg: #eef1f4;
  --sheet: #ffffff;
  --ink: #1b2330;
  --muted: #5b6676;
  --rule: #d5dbe3;
  --band: #f5f7fa;
  --sub: #2f5fb3;   --sub-bg: #eaf0fb;
  --open: #c0352b;  --open-bg: #fdecea;
  --exam: #a35a00;  --exam-bg: #fff2df;
  --event: #23794a; --event-bg: #e6f4ec;
  --font-display: "Frank Ruhl Libre", "David", serif;
  --font-body: "Assistant", "Segoe UI", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12161c; --sheet: #1a2028; --ink: #e6eaf0; --muted: #9aa5b4; --rule: #2e3742; --band: #161b22;
  --sub: #8fb2f0; --sub-bg: #1d2a40; --open: #ff8a7f; --open-bg: #3a1f1d;
  --exam: #f2b366; --exam-bg: #352712; --event: #7fd3a2; --event-bg: #163024; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12161c; --sheet: #1a2028; --ink: #e6eaf0; --muted: #9aa5b4; --rule: #2e3742; --band: #161b22;
  --sub: #8fb2f0; --sub-bg: #1d2a40; --open: #ff8a7f; --open-bg: #3a1f1d;
  --exam: #f2b366; --exam-bg: #352712; --event: #7fd3a2; --event-bg: #163024; color-scheme: dark }

body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 13px; line-height: 1.3; }
html, body { height: 100%; }
.wrap { direction: rtl; box-sizing: border-box; height: 100%; padding-block: 6px 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); margin: 0 auto; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 3px; }
.bar { display: flex; align-items: center; gap: 6px 12px; min-width: 0; }
.bar h1 { font-size: 1.15rem; white-space: nowrap; }
.bar .daytabs { flex: 0 1 auto; min-width: 0; padding-bottom: 0; }
.daytab { padding: 2px 8px; display: flex; gap: 4px; align-items: baseline; }
.daytab b { display: inline; font-size: 0.85rem; }
.daytab span { font-size: 0.75rem; }
.gsel select { font: inherit; font-size: 0.85rem; padding: 3px 6px; border: 1px solid var(--rule); border-radius: 8px; background: var(--sheet); color: var(--ink); }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.bar .legend { margin-inline-start: auto; flex-wrap: nowrap; white-space: nowrap; }
.summary { white-space: nowrap; overflow-x: auto; flex-wrap: nowrap !important; font-size: 0.78rem; min-width: 0; flex: 1 1 auto; gap: 0 10px !important; }

header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; margin: 0; line-height: 1.1; text-wrap: balance; }
.sub-title { color: var(--muted); margin-top: 4px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.85rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

.controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.daytabs, .grades { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; max-width: 100%; }
.daytab { flex: 0 0 auto; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink); border-radius: 8px; padding: 3px 10px; font: inherit; cursor: pointer; text-align: center; }
.daytab b { display: block; font-size: 0.95rem; }
.daytab span { font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.daytab[aria-selected="true"] { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
.daytab[aria-selected="true"] span { color: inherit; opacity: 0.75; }
.grade { flex: 0 0 auto; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink); border-radius: 999px; padding: 4px 12px; font: inherit; font-size: 0.875rem; cursor: pointer; }
.grade[aria-pressed="true"] { background: var(--sub-bg); border-color: var(--sub); color: var(--sub); font-weight: 700; }
.daytab:focus-visible, .grade:focus-visible { outline: 2px solid var(--sub); outline-offset: 2px; }

.summary { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 0.9rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.summary b { color: var(--ink); }
.summary .bad b { color: var(--open); }

.scroll { overflow: auto; min-height: 0; background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; overscroll-behavior: contain; }
table { border-collapse: separate; border-spacing: 0; width: 100%; table-layout: fixed; }
th.hr { width: 30px; position: sticky; right: 0; z-index: 1; background: var(--band); text-align: center; vertical-align: middle; font-family: var(--font-display); font-size: 1.3rem; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; border-left: 2px solid var(--muted); }
thead th.hr.corner { z-index: 4; font-family: var(--font-body); font-size: 0.8rem; color: var(--muted); }
.allhr { display: block; font-family: var(--font-body); font-size: 0.75rem; color: var(--muted); line-height: 1.2; }
thead th { border-bottom: 2px solid var(--muted); text-align: center; font-size: 1.1rem; color: var(--ink); background: var(--band); }
.gs { border-right: 2px solid var(--muted); }
th, td { border-bottom: 1px solid var(--rule); border-left: 1px solid var(--rule); vertical-align: top; text-align: right; }
th:last-child, td:last-child { border-left: 0; }
thead th { position: sticky; top: 0; background: var(--sheet); z-index: 2; padding: 3px 2px; font-family: var(--font-display); font-size: 1.15rem; color: var(--muted); font-variant-numeric: tabular-nums; }
th.cls { width: 92px; position: sticky; right: 0; background: var(--sheet); z-index: 1; padding: 8px 10px; }
thead th.cls { z-index: 3; font-family: var(--font-body); font-size: 0.8rem; letter-spacing: 0.04em; }
tbody th.cls b { font-family: var(--font-display); font-size: 1.3rem; display: block; }
tr.hourrow th { background: var(--band); padding: 6px 10px; font-family: var(--font-display); font-size: 1.05rem; color: var(--ink); border-top: 2px solid var(--muted); font-variant-numeric: tabular-nums; }
tr.hourrow th.cls { font-family: var(--font-body); font-size: 0.85rem; font-weight: 700; color: var(--muted); background: var(--band); }
.hn { font-size: 0.7rem; font-weight: 700; color: var(--muted); letter-spacing: 0.03em; font-variant-numeric: tabular-nums; }
td { padding: 2px 1px; }
.cell { display: flex; flex-direction: column; gap: 2px; }

.lesson { padding: 1px 3px; border-radius: 3px; font-size: 0.82rem; overflow-wrap: anywhere; }
.lesson .s { font-weight: 700; }
.lesson .t { color: var(--muted); }
.lesson.sub { background: var(--sub-bg); }
.lesson.sub .t s, .lesson.open .t s, .lesson.no_need .t s { color: var(--muted); }
.lesson .to { color: var(--sub); font-weight: 700; }
.lesson.open { background: var(--open-bg); }
.lesson.open .to { color: var(--open); }
.lesson.no_need { opacity: 0.75; }
.lesson .why { font-size: 0.74rem; color: var(--muted); }
.lesson.off { opacity: 0.4; }

.banner { border-inline-start: 2px solid; border-radius: 3px; padding: 1px 3px; font-size: 0.82rem; overflow-wrap: anywhere; }
.banner .n { font-weight: 700; }
.banner.exam { background: var(--exam-bg); border-color: var(--exam); }
.banner.exam .n { color: var(--exam); }
.banner.event { background: var(--event-bg); border-color: var(--event); }
.banner.event .n { color: var(--event); }
.banner.cont { font-size: 0.76rem; padding: 1px 6px; }
.allday { display: flex; flex-direction: column; gap: 3px; margin-top: 4px; font-family: var(--font-body); font-weight: 400; }
.allday .banner { font-size: 0.72rem; }
.empty { color: var(--rule); font-size: 0.8rem; }

.note { color: var(--muted); font-size: 0.72rem; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.controls { flex-wrap: nowrap; overflow-x: auto; }
@media (max-width: 1100px) { .bar .legend { display: none; } }
@media (max-width: 760px) { .bar { flex-wrap: wrap; } .daytab { padding: 1px 6px; } .daytab span { display: none; } .summary { flex-basis: 100%; } }
.wrap { padding-block: 2px; }
.lesson.grp .tr { color: var(--muted); border-radius: 3px; padding: 0 2px; }
.lesson.grp .tr.sub { background: var(--sub-bg); }
.lesson.grp .tr.open { background: var(--open-bg); }
.lesson.grp .tr.no_need { opacity: 0.75; }
.lesson.grp .tr s { color: var(--muted); }
.lesson.grp .tr.open .to { color: var(--open); }
/* clear line between the hours, across the whole table */
tbody tr > td, tbody tr > th { border-bottom: 2px solid var(--hourline); }
:root { --hourline: #7b8696; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --hourline: #6f7b8c; } }
:root[data-theme="dark"] { --hourline: #6f7b8c; }
.bar { flex-wrap: wrap; row-gap: 2px; }
.lg { flex-basis: 100%; font-size: 0.7rem; line-height: 1.1; color: var(--muted); white-space: nowrap; overflow: hidden; }
.lg i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-inline: 4px 2px; vertical-align: middle; }
thead th { padding: 1px 2px !important; font-size: 0.95rem !important; }
.sample { display: inline-block; background: var(--exam-bg); color: var(--exam); border-radius: 6px; padding: 2px 8px; font-size: 0.8rem; font-weight: 700; }
@media (max-width: 760px) { h1 { font-size: 1.3rem; } th.hr { width: 26px; font-size: 1.05rem; } }
html, body { margin: 0; }
.stale b { color: var(--open); }
</style>
</head>

</div>

rs": {"1": {"lessons": [{"subject": "חינוך גופני", "teacher": "כגן אלמוג", "state": "regular"}, {"subject": "חינוך גופני", "teacher": "קונטנט יעל", "state": "regular"}], "banners": []}, "2": {"lessons": [], "banners": []}, "3": {"lessons": [{"subject": "ספרות", "teacher": "דדיה שמעון", "state": "regular"}], "banners": []}, "4": {"lessons": [{"subject": "ספרות", "teacher": "דדיה שמעון", "state": "regular"}], "banners": []}, "5": {"lessons": [{"subject": "אמנות", "teacher": "כהן נורדמן רומי", "state": "regular"}, {"subject": "מוסיקה", "teacher": "פינסקי רוי", "state": "regular"}, {"subject": "תאטרון", "teacher": "קרן הדר", "state": "regular"}], "banners": []}, "6": {"lessons": [{"subject": "אמנות", "teacher": "כהן נורדמן רומי", "state": "regular"}, {"subject": "מוסיקה", "teacher": "פינסקי רוי", "state": "regular"}, {"subject": "תאטרון", "teacher": "קרן הדר", "state": "regular"}], "banners": []}, "7": {"lessons": [], "banners": []}}}]}], "hours": 7, "today": "2026-11-16", "read_at": "16.11.2026 21:43"};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const GRADES = ["ז", "ח", "ט", "י", "יא", "יב"];
const gradeOf = c => c.replace(/\d+$/, "");
let dayIdx = Math.max(0, DATA.days.findIndex(d => d.date === DATA.today));
let grade = "";

function bannerHtml(b) {
  if (b.cont) return `<div class="banner ${b.type} cont">המשך · ${esc(b.name)}</div>`;
  const who = b.type === "exam" ? "משגיחים" : "מלווים";
  const span = b.span[0] && b.span[0] !== b.span[1] ? ` (שעות ${b.span[0]}–${b.span[1]})` : "";
  return `<div class="banner ${b.type}"><div class="n">${b.type === "exam" ? "מבחן: " : ""}${esc(b.name)}${span}</div>
    ${b.people.length ? `<div>${who}: ${esc(b.people.join(", "))}</div>` : ""}</div>`;
}

function lessonHtml(l, off) {
  const cls = `lesson ${l.state}${off && l.state === "regular" ? " off" : ""}`;
  let t;
  if (l.state === "sub") t = `<s>${esc(l.teacher)}</s> <span class="to">← ${esc(l.sub)}</span>`;
  else if (l.state === "open") t = `<s>${esc(l.teacher)}</s> <span class="to">← אין מחליף</span>`;
  else if (l.state === "no_need") t = `<s>${esc(l.teacher)}</s> · לא נדרש מחליף`;
  else t = esc(l.teacher);
  return `<div class="${cls}"><div class="s">${esc(l.subject)}</div><div class="t">${t}</div>${l.why ? `<div class="why">${esc(l.why)}</div>` : ""}</div>`;
}

// one block per subject: the subject once, then every teacher of that subject on its own line
function lessonsHtml(lessons, off) {
  const groups = [];
  lessons.forEach(l => {
    let g = groups.find(x => x.subject === l.subject);
    if (!g) groups.push(g = {subject: l.subject, rows: []});
    g.rows.push(l);
  });
  return groups.map(g => {
    const allRegular = g.rows.every(l => l.state === "regular");
    const rows = g.rows.map(l => {
      let t;
      if (l.state === "sub") t = `<s>${esc(l.teacher)}</s> <span class="to">← ${esc(l.sub)}</span>`;
      else if (l.state === "open") t = `<s>${esc(l.teacher)}</s> <span class="to">← אין מחליף</span>`;
      else if (l.state === "no_need") t = `<s>${esc(l.teacher)}</s> · לא נדרש מחליף`;
      else t = esc(l.teacher);
      return `<div class="tr ${l.state}">${t}${l.why ? `<div class="why">${esc(l.why)}</div>` : ""}</div>`;
    }).join("");
    return `<div class="lesson grp${off && allRegular ? " off" : ""}"><div class="s">${esc(g.subject)}</div>${rows}</div>`;
  }).join("");
}

function render() {
  const d = DATA.days[dayIdx];
  document.getElementById("readat").textContent = DATA.read_at;
  const c = d.counts;
  document.getElementById("summary").innerHTML =
    `<span><b>${esc(d.label)} ${esc(d.num)}</b></span><span><b>${c.absent}</b> נעדרים${d.absent.length ? ": " + esc(d.absent.join(", ")) : ""}</span>
     <span><b>${c.sub}</b> החלפות</span>${c.open ? `<span class="bad"><b>${c.open}</b> בלי מחליף</span>` : ""}
     <span><b>${c.exam}</b> מבחנים</span><span><b>${c.event}</b> אירועים</span>
     ${d.read_at ? `<span>עודכן משחף: ${esc(d.read_at)}</span>`
                 : `<span class="stale"><b>לא עודכן משחף</b> - מוצגת המערכת הקבועה בלבד</span>`}`;

  const classes = d.classes.filter(k => !grade || gradeOf(k.name) === grade);
  const gstart = classes.map((k, i) => i > 0 && gradeOf(k.name) !== gradeOf(classes[i - 1].name));
  const gc = i => gstart[i] ? ' class="gs"' : "";
  let html = `<thead><tr><th class="hr corner">שעה</th>${classes.map((k, i) => `<th${gc(i)}>${esc(k.name)}</th>`).join("")}</tr></thead><tbody>`;
  if (classes.some(k => k.allday.length)) {
    html += `<tr><th class="hr" scope="row"><span class="allhr">כל<br>היום</span></th>${classes.map((k, i) =>
      `<td${gc(i)}><div class="cell">${k.allday.map(bannerHtml).join("") || '<span class="empty">—</span>'}</div></td>`).join("")}</tr>`;
  }
  for (let h = 1; h <= (DATA.hours || 7); h++) {
    html += `<tr><th class="hr" scope="row">${h}</th>`;
    classes.forEach((k, i) => {
      const cell = k.hours[String(h)];
      const off = cell.banners.length > 0 || k.allday.length > 0;
      const body = cell.banners.map(bannerHtml).join("") + lessonsHtml(cell.lessons, off);
      html += `<td${gc(i)}><div class="cell">${body || '<span class="empty">—</span>'}</div></td>`;
    });
    html += `</tr>`;
  }
  const tbl = document.getElementById("tbl");
  tbl.style.minWidth = `${30 + classes.length * 104}px`;
  tbl.innerHTML = html + "</tbody>";

  document.querySelectorAll(".daytab").forEach((t, i) => t.setAttribute("aria-selected", String(i === dayIdx)));
}

document.getElementById("daytabs").innerHTML = DATA.days.map((d, i) =>
  `<button class="daytab" id="day-${i}" role="tab" data-i="${i}"><b>${esc(d.label)}</b><span>${esc(d.num)}</span></button>`).join("");
const sel = document.getElementById("gradeSel");
sel.innerHTML = [["", "כל השכבות"], ...GRADES.map(g => [g, "שכבה " + g])].map(([g, label]) =>
  `<option value="${g}">${label}</option>`).join("");
sel.addEventListener("change", () => { grade = sel.value; render(); });
document.querySelectorAll(".daytab").forEach(b => b.addEventListener("click", () => { dayIdx = +b.dataset.i; render(); }));
render();
</script>
